<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)" lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} - Innkeeper|">Innkeeper</title>
    <link rel="stylesheet" th:href="@{/css/innkeeper.css}">
    <link rel="stylesheet" th:href="@{/css/print.css}" media="print">
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <script th:src="@{/js/theme.js}"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div th:replace="~{fragments/header :: header}">The demo strip and the header.</div>
<div class="shell" th:classappend="${shell} ?: 'measure'"
     th:if="${message != null or error != null}">
    <p class="flash" th:if="${message}" th:text="${message}" role="status">Something worked.</p>
    <p class="flash flash-error" th:if="${error}" th:text="${error}" role="status">And something
        did not.</p>
</div>
<main id="main" th:replace="${content}">
    <p>The page content goes here.</p>
</main>
<div th:replace="~{fragments/footer :: footer}">The under-the-hood line.</div>
<script th:src="@{/js/copy.js}" defer></script>
</body>
</html>
