<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Too many requests', ~{::main})}">
<body>
<main>
    <h1>Too many requests</h1>
    <p>This is a small demo on free hosting, so bookings and complaints are limited to twenty an
        hour from one address. Try again later.</p>
    <p th:if="${message}" th:text="${message}">What was refused.</p>
    <p>Request id: <span th:text="${requestId}">n/a</span></p>
    <p><a th:href="@{/}">Back to the front desk</a></p>
</main>
</body>
</html>
