<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Somebody got there first', ~{::main})}">
<body>
<main class="shell measure" id="main">
    <h1>Somebody got there first</h1>
    <div class="prose">
        <p class="lede" th:if="${message}" th:text="${message}">That room was just taken for those
            dates.</p>
        <p>Nothing was changed. Try other dates or another room.</p>
    </div>
    <p class="note">Request id <span th:text="${requestId}">n/a</span></p>
    <p class="actions"><a class="btn btn-outline" th:href="@{/rooms}">Look for another room</a></p>
</main>
</body>
</html>
