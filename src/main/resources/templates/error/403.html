<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout('Managers only', ~{::main})}">
<body>
<main class="shell measure" id="main">
    <h1>Managers only</h1>
    <div class="prose">
        <p class="lede">Your account cannot open that page. Sign in as a manager, or go back to the
            desk.</p>
        <p th:if="${message}" th:text="${message}">What was refused.</p>
    </div>
    <p class="note">Request id <span th:text="${requestId}">n/a</span></p>
    <p class="actions">
        <a class="btn btn-outline" th:href="@{/staff}">Back to the desk</a>
        <a class="btn btn-outline" th:href="@{/login}">Sign in as a manager</a>
    </p>
</main>
</body>
</html>
