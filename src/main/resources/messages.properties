# What a value the binder could not parse should say. Spring looks for the most specific code
# first, so a date field says "Enter a date" wherever it appears.
typeMismatch=That value is not one we can read
typeMismatch.java.time.LocalDate=Enter a date
typeMismatch.java.lang.Long=Enter a number
typeMismatch.java.lang.Integer=Enter a number
typeMismatch.int=Enter a number
typeMismatch.java.math.BigDecimal=Enter an amount like 120.00
typeMismatch.checkIn=Enter a date
typeMismatch.checkOut=Enter a date
typeMismatch.branchId=Choose a hotel from the list
typeMismatch.category=Choose what this is about
