name: ci
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test (PostgreSQL tests are mandatory here)
        run: mvn -q -B verify -Dinnkeeper.requireDocker=true
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/sahajm99/innkeeper:latest
            ghcr.io/sahajm99/innkeeper:sha-${{ steps.sha.outputs.short }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check deploy configuration
        id: config
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ] || [ -z "$APP_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Render secrets not configured; skipping deploy."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Trigger Render deploy and wait for it to go live
        if: steps.config.outputs.configured == 'true'
        run: |
          deploy=$(curl -sf -X POST "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          id=$(echo "$deploy" | jq -r '.id')
          echo "deploy $id triggered"
          for i in $(seq 1 75); do
            status=$(curl -sf "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$id" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status')
            echo "[$i] $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|canceled|pre_deploy_failed|deactivated) echo "deploy ended with $status"; exit 1 ;;
            esac
            sleep 20
          done
          echo "timed out waiting for the deploy"; exit 1
      - name: Smoke check the live service
        if: steps.config.outputs.configured == 'true'
        run: scripts/smoke.sh "$APP_URL"
